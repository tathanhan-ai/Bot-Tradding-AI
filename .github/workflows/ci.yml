name: CI Test Suite & Security Invariants

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Unit Tests & Gating Policies (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ '3.11', '3.12' ]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ruff bandit pip-audit

    - name: Lint (ruff)
      run: |
        ruff check . --select F,E9 --ignore E501 || true
        ruff check config risk strategy trading data security ui --select F --ignore E501

    - name: Security scan (bandit)
      run: |
        bandit -r config risk strategy trading data security ui -ll -q || true

    - name: Dependency audit (pip-audit)
      run: |
        pip-audit --desc || true

    - name: Secret scan (gitleaks)
      uses: gitleaks/gitleaks-action@v3.0.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: No hardcoded credentials
      shell: bash
      run: |
        ! grep -rn --include='*.py' -E 'sk-[A-Za-z0-9_-]{8,}|BEGIN [A-Z ]*PRIVATE KEY' config risk strategy trading data security ui tests || (echo 'hardcoded credential found' && exit 1)

    - name: Run Fail-Closed Safety & Security Regression Suite
      run: |
        python -m unittest tests/test_control_plane_security.py tests/test_fail_closed_policy.py

    - name: Run Full Test Discovery
      run: |
        python -m unittest discover -s tests -p "test_*.py"
